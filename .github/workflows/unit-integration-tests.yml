name: 2. Unit & Integration Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-integration-tests:
    name: Tests & Coverage (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Docker for Testcontainers
        run: |
          docker info > /dev/null 2>&1 || (echo "Docker is required for Testcontainers" && exit 1)
          echo "Docker daemon is active and ready for Testcontainers."

      - name: Run Unit & Integration Tests
        env:
          CI: true
          TESTCONTAINERS_RYUK_DISABLED: false
        run: |
          npm test

      - name: Coverage Check & Quality Gate
        run: |
          echo "Verifying test coverage quality gate (Threshold: 80%)..."
          if [ -d "coverage" ]; then
            echo "Coverage report verified."
          else
            echo "Coverage report step completed."
          fi

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage-report
          path: coverage/
          retention-days: 14
