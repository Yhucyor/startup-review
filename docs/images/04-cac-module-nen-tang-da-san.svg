<title id="expanded-modules-title">Các module của nền tảng bán hàng đa sàn</title><desc id="expanded-modules-desc">Account và Organization giới hạn quyền cho Catalog, AI Optimization, Listing, Marketplace Connection, Orders, Customer Service, Analytics và xuất hoặc chuyển dữ liệu đơn.</desc><rect width="1280" height="1372" fill="#fafaf7"/><path class="tech-edge" d="M380 404H468"/><path class="tech-edge" d="M812 404H900"/><path class="tech-edge" d="M1072 536V644"/><path class="tech-edge" d="M900 752H812"/><path class="tech-edge" d="M468 752H380"/><path class="tech-edge" d="M640 872V1000"/><path class="tech-edge" d="M744 872V924Q744 932 752 932H1064Q1072 932 1072 940V1000"/><rect x="820" y="368" width="72" height="24" fill="#fafaf7"/><text x="856.0" y="385" class="tech-label" text-anchor="middle">duyệt</text><rect x="824" y="716" width="64" height="24" fill="#fafaf7"/><text x="856.0" y="733" class="tech-label" text-anchor="middle">đơn</text><rect x="652" y="896" width="172" height="24" fill="#fafaf7"/><text x="738.0" y="913" class="tech-label" text-anchor="middle">sự kiện nghiệp vụ</text><g><rect class="box" x="40" y="40" width="1200" height="172" fill="#eaf2ff" stroke="#2563eb"/><text x="64" y="68" class="tag" >TENANT BOUNDARY · ÁP DỤNG CHO TẤT CẢ MODULE</text><text x="64" y="104" class="tech-name" >Account / Organization</text><text x="64" y="144" class="tech-body" >Account, membership, role và quyền theo doanh nghiệp; mọi bản ghi / job / asset đều gắn tenantId.</text><text x="64" y="172" class="tech-body" >Next.js Omnichannel Dashboard → NestJS API: chọn doanh nghiệp, quản lý sản phẩm, bài đăng, đơn và báo cáo.</text><text x="64" y="200" class="tech-body" >Các module cùng backend TypeScript; sơ đồ này không yêu cầu tách thành microservices.</text></g><g><rect class="box" x="40" y="308" width="340" height="228" fill="#eaf2ff" stroke="#2563eb"/><text x="64" y="336" class="tag" >PIM · NGUỒN DỮ LIỆU GỐC</text><text x="64" y="372" class="tech-name" >Catalog</text><text x="64" y="412" class="tech-body" >Product: nội dung + ảnh gốc</text><text x="64" y="440" class="tech-body" >Variant: SKU, thuộc tính, giá</text><text x="64" y="468" class="tech-body" >Inventory: số có thể bán, dự phòng</text><text x="64" y="496" class="tech-body" >Nhập CSV, sửa một nơi</text><text x="64" y="524" class="tech-body" >Thay đổi → tạo job đồng bộ</text></g><g><rect class="box" x="468" y="308" width="344" height="228" fill="#f1eaff" stroke="#7c3aed"/><text x="492" y="336" class="tag" >LANGGRAPH + AI SDK</text><text x="492" y="372" class="tech-name" >AI Optimization</text><text x="492" y="412" class="tech-body" >Translation + Localization</text><text x="492" y="440" class="tech-body" >SEO / Keywords + nội dung</text><text x="492" y="468" class="tech-body" >Image adaptation: ảnh theo sàn</text><text x="492" y="496" class="tech-body" >Pricing suggestion: giá đề xuất</text><text x="492" y="524" class="tech-body" >Trả proposal, chưa ghi đè dữ liệu</text></g><g><rect class="box" x="900" y="308" width="340" height="228" fill="#fff2d8" stroke="#c45b08"/><text x="924" y="336" class="tag" >PHIÊN BẢN THEO TỪNG SÀN</text><text x="924" y="372" class="tech-name" >Marketplace Listing</text><text x="924" y="412" class="tech-body" >Product / SKU → listing / SKU sàn</text><text x="924" y="440" class="tech-body" >Bản nội dung + ảnh + giá đã duyệt</text><text x="924" y="468" class="tech-body" >Chọn shop / sàn trước khi đăng</text><text x="924" y="496" class="tech-body" >Job riêng cho từng đích</text><text x="924" y="524" class="tech-body" >Theo dõi thành công / lỗi từng sàn</text></g><g><rect class="box" x="900" y="644" width="340" height="228" fill="#e8f6eb" stroke="#15803d"/><text x="924" y="672" class="tag" >EXTERNAL ADAPTERS</text><text x="924" y="708" class="tech-name" >Marketplace Connection</text><text x="924" y="748" class="tech-body" >Shopee / TikTok Shop / Lazada…</text><text x="924" y="776" class="tech-body" >OAuth / token mã hóa theo shop</text><text x="924" y="804" class="tech-body" >API capability + rate limit</text><text x="924" y="832" class="tech-body" >Đăng, đồng bộ giá / tồn, nhận đơn</text><text x="924" y="860" class="tech-body" >Webhook xác thực / polling</text></g><g><rect class="box" x="468" y="644" width="344" height="228" fill="#e8f6eb" stroke="#15803d"/><text x="492" y="672" class="tag" >ORDER AGGREGATOR</text><text x="492" y="708" class="tech-name" >Orders</text><text x="492" y="748" class="tech-body" >Chuẩn hóa đơn từ nhiều sàn</text><text x="492" y="776" class="tech-body" >Unique: tenant + shop + orderId</text><text x="492" y="804" class="tech-body" >Ghép SKU, trừ tồn trong giao dịch</text><text x="492" y="832" class="tech-body" >Outbox → đồng bộ tồn các listing</text><text x="492" y="860" class="tech-body" >Không âm, không trừ lần hai</text></g><g><rect class="box" x="40" y="644" width="340" height="228" fill="#eaf2ff" stroke="#2563eb"/><text x="64" y="672" class="tag" >SELLER + SUPPORT AGENT</text><text x="64" y="708" class="tech-name" >Customer Service</text><text x="64" y="748" class="tech-body" >Hội thoại / ticket gắn đơn + shop</text><text x="64" y="776" class="tech-body" >AI soạn trả lời từ dữ liệu được phép</text><text x="64" y="804" class="tech-body" >Nhân viên duyệt trước khi gửi</text><text x="64" y="832" class="tech-body" >Gửi qua adapter nếu sàn hỗ trợ</text><text x="64" y="860" class="tech-body" >Không tự hoàn tiền / hứa bồi thường</text></g><g><rect class="box" x="468" y="1000" width="344" height="228" fill="#fdebf3" stroke="#be185d"/><text x="492" y="1028" class="tag" >READ MODELS / AGGREGATION</text><text x="492" y="1064" class="tech-name" >Analytics</text><text x="492" y="1104" class="tech-body" >Theo doanh nghiệp, sàn và SKU</text><text x="492" y="1132" class="tech-body" >Đơn, doanh thu theo tiền tệ</text><text x="492" y="1160" class="tech-body" >Tồn, lỗi sync, hiệu quả AI</text><text x="492" y="1188" class="tech-body" >Chỉ số SEO / click nếu có nguồn</text><text x="492" y="1216" class="tech-body" >Thiếu dữ liệu → ghi chưa có</text></g><g><rect class="box" x="900" y="1000" width="340" height="228" fill="#eaf2ff" stroke="#2563eb"/><text x="924" y="1028" class="tag" >EXPORT / DELIVERY HANDOFF</text><text x="924" y="1064" class="tech-name" >Xuất và chuyển dữ liệu</text><text x="924" y="1104" class="tech-body" >CSV + Excel (.xlsx) theo quyền</text><text x="924" y="1132" class="tech-body" >File qua liên kết có hạn dùng</text><text x="924" y="1160" class="tech-body" >Hoặc API tới đơn vị người bán chọn</text><text x="924" y="1188" class="tech-body" >Preview phạm vi → xác nhận gửi</text><text x="924" y="1216" class="tech-body" >Không quản lý vận chuyển nội bộ</text></g><path d="M40 1268H1240" stroke="#c7c7c7"/><text x="40" y="1300" class="small" >Mũi tên: luồng dữ liệu chính · Account / Organization kiểm soát toàn bộ module bên dưới.</text><text x="40" y="1332" class="small" >Catalog thay đổi → outbox → sync worker → adapter → từng listing; chỉ cập nhật “đã đồng bộ” sau xác nhận.</text></svg>