<title id="technical-system-title">Kiến trúc điều phối và thực thi</title><desc id="technical-system-desc">Sự kiện được lưu trong PostgreSQL trước khi vào BullMQ; LangGraph điều phối agent, chờ phê duyệt khi cần, và worker kiểm tra lại trước khi gọi sàn mục tiêu.</desc><rect width="1280" height="1100" fill="#fafaf7"/><path class="tech-edge" d="M380 156H468"/><path class="tech-edge" d="M812 156H900"/><path class="tech-edge" d="M1140 260V380"/><path class="tech-edge" d="M972 380V328Q972 320 964 320H712Q704 320 704 312V260" stroke-dasharray="6 5"/><rect x="744" y="284" width="208" height="24" fill="#fafaf7"/><text x="848.0" y="301" class="tech-label" text-anchor="middle">checkpoint / khôi phục</text><path class="tech-edge" d="M900 476H812"/><path class="tech-edge" d="M468 476H380"/><path class="tech-edge" d="M380 568H468" stroke-dasharray="6 5"/><rect x="382" y="440" width="84" height="24" fill="#fafaf7"/><text x="424.0" y="457" class="tech-label" text-anchor="middle">cần duyệt</text><rect x="382" y="532" width="84" height="24" fill="#fafaf7"/><text x="424.0" y="549" class="tech-label" text-anchor="middle">resume</text><path class="tech-edge" d="M640 612V744"/><rect x="652" y="660" width="220" height="24" fill="#fafaf7"/><text x="762.0" y="677" class="tech-label" text-anchor="middle">đủ điều kiện → tạo job</text><path class="tech-edge" d="M812 856H900"/><path class="tech-edge" d="M900 936H812" stroke-dasharray="6 5"/><rect x="816" y="820" width="80" height="24" fill="#fafaf7"/><text x="856.0" y="837" class="tech-label" text-anchor="middle">gửi API</text><rect x="816" y="900" width="80" height="24" fill="#fafaf7"/><text x="856.0" y="917" class="tech-label" text-anchor="middle">kết quả</text><path class="tech-edge" d="M468 856H380"/><g><rect class="box" x="40" y="60" width="340" height="200" fill="#eaf2ff" stroke="#2563eb"/><text x="64" y="88" class="tag" >01 · ĐIỂM VÀO</text><text x="64" y="124" class="tech-name" >API / Event intake</text><text x="64" y="164" class="tech-body" >UI, CSV, webhook hoặc polling</text><text x="64" y="192" class="tech-body" >Xác thực + tenant + quyền</text><text x="64" y="220" class="tech-body" >Chống sự kiện trùng</text><text x="64" y="248" class="tech-body" >Lưu thay đổi và công việc</text></g><g><rect class="box" x="468" y="60" width="344" height="200" fill="#fdebf3" stroke="#be185d"/><text x="492" y="88" class="tag" >02 · POSTGRESQL</text><text x="492" y="124" class="tech-name" >Transaction + outbox</text><text x="492" y="164" class="tech-body" >Dữ liệu + event + job cùng giao dịch</text><text x="492" y="192" class="tech-body" >runId, tenantId, inputVersion</text><text x="492" y="220" class="tech-body" >Chỉ phát job sau khi commit</text><text x="492" y="248" class="tech-body" >Outbox relay thử gửi lại nếu lỗi</text></g><g><rect class="box" x="900" y="60" width="340" height="200" fill="#e8f6eb" stroke="#15803d"/><text x="924" y="88" class="tag" >03 · REDIS / BULLMQ</text><text x="924" y="124" class="tech-name" >Queue + worker</text><text x="924" y="164" class="tech-body" >Nhận job bằng mã chống trùng</text><text x="924" y="192" class="tech-body" >Gọi hoặc tiếp tục workflow AI</text><text x="924" y="220" class="tech-body" >Timeout, backoff, retry giới hạn</text><text x="924" y="248" class="tech-body" >Không giữ trạng thái duy nhất</text></g><g><rect class="box" x="900" y="380" width="340" height="232" fill="#f1eaff" stroke="#7c3aed"/><text x="924" y="408" class="tag" >04 · LANGGRAPH JS</text><text x="924" y="444" class="tech-name" >Workflow orchestrator</text><text x="924" y="484" class="tech-body" >Route → agents → gom kết quả</text><text x="924" y="512" class="tech-body" >Chạy song song phần độc lập</text><text x="924" y="540" class="tech-body" >Dừng / tiếp tục theo trạng thái</text><text x="924" y="568" class="tech-body" >Checkpoint bền vững theo runId</text><text x="924" y="596" class="tech-body" >Chi tiết agent ở sơ đồ kế tiếp</text></g><g><rect class="box" x="468" y="380" width="344" height="232" fill="#fff2d8" stroke="#c45b08"/><text x="492" y="408" class="tag" >05 · QUY TẮC BẰNG CHƯƠNG TRÌNH</text><text x="492" y="444" class="tech-name" >Validation + policy gate</text><text x="492" y="484" class="tech-body" >Schema + nguồn + quy tắc sàn</text><text x="492" y="512" class="tech-body" >Kiểm tra phiên bản và cảnh báo</text><text x="492" y="540" class="tech-body" >Kiểm tra quyền, phạm vi, hạn mức</text><text x="492" y="568" class="tech-body" >Auto hợp lệ: cho phép thực thi</text><text x="492" y="596" class="tech-body" >Thiếu dữ liệu: chờ bổ sung</text></g><g><rect class="box" x="40" y="380" width="340" height="232" fill="#fff2d8" stroke="#c45b08"/><text x="64" y="408" class="tag" >HUMAN-IN-THE-LOOP</text><text x="64" y="444" class="tech-name" >Approval / correction</text><text x="64" y="484" class="tech-body" >Lưu preview + phiên bản cần duyệt</text><text x="64" y="512" class="tech-body" >Chờ duyệt không giữ worker chạy</text><text x="64" y="540" class="tech-body" >API kiểm tra quyền người duyệt</text><text x="64" y="568" class="tech-body" >Duyệt → tiếp tục, kiểm tra lại</text><text x="64" y="596" class="tech-body" >Từ chối → kết thúc đề xuất này</text></g><g><rect class="box" x="468" y="744" width="344" height="232" fill="#e8f6eb" stroke="#15803d"/><text x="492" y="772" class="tag" >06 · JOB THỰC THI RIÊNG</text><text x="492" y="808" class="tech-name" >Execution worker</text><text x="492" y="848" class="tech-body" >Đọc lại quyền và quy tắc mới nhất</text><text x="492" y="876" class="tech-body" >Chặn bản cũ, vượt hạn mức, trùng</text><text x="492" y="904" class="tech-body" >Gọi adapter đúng shop / tenant</text><text x="492" y="932" class="tech-body" >Retry: đối soát trước khi gửi lại</text><text x="492" y="960" class="tech-body" >Chờ sàn xác nhận kết quả</text></g><g><rect class="box" x="900" y="744" width="340" height="232" fill="#eaf2ff" stroke="#2563eb"/><text x="924" y="772" class="tag" >07 · RANH GIỚI TÍCH HỢP</text><text x="924" y="808" class="tech-name" >Marketplace adapters</text><text x="924" y="848" class="tech-body" >Chuyển dữ liệu sang định dạng sàn</text><text x="924" y="876" class="tech-body" >Dùng kết nối được cấp quyền</text><text x="924" y="904" class="tech-body" >Trả mã bài đăng / lỗi / trạng thái</text><text x="924" y="932" class="tech-body" >Lỗi dữ liệu → đề xuất sửa mới</text><text x="924" y="960" class="tech-body" >Demo adapter tách khỏi sàn thật</text></g><g><rect class="box" x="40" y="744" width="340" height="232" fill="#fdebf3" stroke="#be185d"/><text x="64" y="772" class="tag" >08 · CÙNG POSTGRESQL</text><text x="64" y="808" class="tech-name" >State + audit log</text><text x="64" y="848" class="tech-body" >Lưu kết quả và số lần thử</text><text x="64" y="876" class="tech-body" >Ai / quy tắc nào cho phép chạy</text><text x="64" y="904" class="tech-body" >UI đọc tiến độ từ trạng thái lưu</text><text x="64" y="932" class="tech-body" >Đơn / tồn: giao dịch, chống lặp</text><text x="64" y="960" class="tech-body" >Đây không phải database thứ hai</text></g><path d="M40 1012H1240" stroke="#c7c7c7"/><path class="tech-edge" d="M40 1040H84"/><text x="100" y="1046" class="small" >Luồng xử lý / chuyển giao</text><path class="tech-edge" d="M456 1040H500" stroke-dasharray="6 5"/><text x="516" y="1046" class="small" >Trạng thái, resume hoặc phản hồi</text><text x="932" y="1046" class="small" >Mọi bước gắn tenantId + runId</text></svg>