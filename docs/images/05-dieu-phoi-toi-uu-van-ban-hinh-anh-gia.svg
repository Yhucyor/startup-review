<title id="expanded-optimization-title">Điều phối tối ưu văn bản hình ảnh và giá</title><desc id="expanded-optimization-desc">Router chạy các nhánh văn bản, ảnh và đề xuất giá phù hợp, gom kết quả có phiên bản rồi chuyển qua kiểm tra và phê duyệt trước khi đăng đa sàn.</desc><rect width="1280" height="1404" fill="#fafaf7"/><path class="tech-edge" d="M512 212V256Q512 264 504 264H218Q210 264 210 272V320"/><path class="tech-edge" d="M640 212V320"/><path class="tech-edge" d="M752 212V256Q752 264 760 264H1064Q1072 264 1072 272V320"/><path class="tech-edge" d="M210 548V640"/><path class="tech-edge" d="M640 548V640"/><path class="tech-edge" d="M1072 548V640"/><path class="tech-edge" d="M210 840V924Q210 932 218 932H504Q512 932 512 940V1028"/><path class="tech-edge" d="M640 840V1028"/><path class="tech-edge" d="M1072 840V924Q1072 932 1064 932H760Q752 932 752 940V1028"/><path class="tech-edge" d="M812 1144H900"/><g><rect class="box" x="468" y="40" width="344" height="172" fill="#f1eaff" stroke="#7c3aed"/><text x="492" y="68" class="tag" >WORKFLOW THEO SHOP / SÀN</text><text x="492" y="104" class="tech-name" >Optimization router</text><text x="492" y="144" class="tech-body" >Snapshot sản phẩm + targetProfile</text><text x="492" y="172" class="tech-body" >Chọn bước cần chạy, giới hạn chi phí</text><text x="492" y="200" class="tech-body" >Các nhánh độc lập chạy song song</text></g><g><rect class="box" x="40" y="320" width="340" height="228" fill="#f1eaff" stroke="#7c3aed"/><text x="64" y="348" class="tag" >NHÁNH VĂN BẢN</text><text x="64" y="384" class="tech-name" >Text agents</text><text x="64" y="424" class="tech-body" >Translation → ngôn ngữ đích</text><text x="64" y="452" class="tech-body" >Localization → cách diễn đạt</text><text x="64" y="480" class="tech-body" >Content + SEO / Keywords</text><text x="64" y="508" class="tech-body" >Schema theo sàn + nguồn thông tin</text><text x="64" y="536" class="tech-body" >Giữ luồng Review ở sơ đồ số 2</text></g><g><rect class="box" x="468" y="320" width="344" height="228" fill="#f1eaff" stroke="#7c3aed"/><text x="492" y="348" class="tag" >NHÁNH HÌNH ẢNH</text><text x="492" y="384" class="tech-name" >Image adaptation agent</text><text x="492" y="424" class="tech-body" >Chọn ảnh gốc + cấu hình đích</text><text x="492" y="452" class="tech-body" >Yêu cầu xóa / thay phông nền</text><text x="492" y="480" class="tech-body" >Dịch câu chữ, dàn chữ ngoại ngữ</text><text x="492" y="508" class="tech-body" >Đề xuất bố cục, không đổi sản phẩm</text><text x="492" y="536" class="tech-body" >Tạo phiên bản mới, giữ ảnh gốc</text></g><g><rect class="box" x="900" y="320" width="340" height="228" fill="#f1eaff" stroke="#7c3aed"/><text x="924" y="348" class="tag" >NHÁNH GIÁ</text><text x="924" y="384" class="tech-name" >Pricing suggestion agent</text><text x="924" y="424" class="tech-body" >Đọc giá vốn / phí / tiền tệ nếu có</text><text x="924" y="452" class="tech-body" >Đề xuất giá + lý do + giả định</text><text x="924" y="480" class="tech-body" >Thiếu đầu vào → yêu cầu bổ sung</text><text x="924" y="508" class="tech-body" >Không tự bịa giá thị trường</text><text x="924" y="536" class="tech-body" >Không tự ghi giá hoặc đổi tiền tệ</text></g><g><rect class="box" x="40" y="640" width="340" height="200" fill="#eaf2ff" stroke="#2563eb"/><text x="64" y="668" class="tag" >AI SDK · PROVIDER CẤU HÌNH</text><text x="64" y="704" class="tech-name" >OpenAI hoặc Claude</text><text x="64" y="744" class="tech-body" >Adapter gọi mô hình được chọn</text><text x="64" y="772" class="tech-body" >Đầu ra có cấu trúc + kiểm tra schema</text><text x="64" y="800" class="tech-body" >Timeout, ngân sách theo tenant</text><text x="64" y="828" class="tech-body" >Không gửi token sàn / PII dư thừa</text></g><g><rect class="box" x="468" y="640" width="344" height="200" fill="#eaf2ff" stroke="#2563eb"/><text x="492" y="668" class="tag" >IMAGE API + RENDER WORKER</text><text x="492" y="704" class="tech-name" >Xử lý ảnh và dàn chữ</text><text x="492" y="744" class="tech-body" >Ứng viên: Photoroom / SD service</text><text x="492" y="772" class="tech-body" >API xử lý nền; renderer chèn chữ</text><text x="492" y="800" class="tech-body" >Lưu asset mới + provenance</text><text x="492" y="828" class="tech-body" >Kiểm tra file, URL, kích thước</text></g><g><rect class="box" x="900" y="640" width="340" height="200" fill="#fff2d8" stroke="#c45b08"/><text x="924" y="668" class="tag" >DETERMINISTIC VALIDATION</text><text x="924" y="704" class="tech-name" >Bộ kiểm tra giá</text><text x="924" y="744" class="tech-body" >Tính phí / biên lợi nhuận bằng code</text><text x="924" y="772" class="tech-body" >Kiểm tra tiền tệ, ngưỡng thay đổi</text><text x="924" y="800" class="tech-body" >Lưu dữ liệu dùng để tính đề xuất</text><text x="924" y="828" class="tech-body" >Thiếu quy tắc → chặn áp dụng</text></g><g><rect class="box" x="468" y="1028" width="344" height="228" fill="#fdebf3" stroke="#be185d"/><text x="492" y="1056" class="tag" >JOIN + VERSIONED PROPOSAL</text><text x="492" y="1092" class="tech-name" >Gom kết quả theo phiên bản</text><text x="492" y="1132" class="tech-body" >Text + image assets + pricing</text><text x="492" y="1160" class="tech-body" >Đối chiếu sản phẩm / chữ trên ảnh</text><text x="492" y="1188" class="tech-body" >Cảnh báo thông tin chưa có nguồn</text><text x="492" y="1216" class="tech-body" >Giữ kết quả hợp lệ nếu nhánh lỗi</text><text x="492" y="1244" class="tech-body" >Lưu PostgreSQL + asset storage</text></g><g><rect class="box" x="900" y="1028" width="340" height="228" fill="#e8f6eb" stroke="#15803d"/><text x="924" y="1056" class="tag" >DÙNG CỔNG CHUNG Ở SƠ ĐỒ 1</text><text x="924" y="1092" class="tech-name" >Policy → approval → execute</text><text x="924" y="1132" class="tech-body" >Preview text / ảnh / giá từng shop</text><text x="924" y="1160" class="tech-body" >Kiểm tra quyền, phiên bản, hạn mức</text><text x="924" y="1188" class="tech-body" >Giá đề xuất cần người có quyền duyệt</text><text x="924" y="1216" class="tech-body" >Tạo job đăng / sync theo từng đích</text><text x="924" y="1244" class="tech-body" >Worker kiểm tra lại ngay khi gửi</text></g><path d="M40 1296H1240" stroke="#c7c7c7"/><text x="40" y="1332" class="small" >Agent đề xuất; code kiểm tra; worker thực thi. Mỗi kết quả gắn tenantId, runId, inputVersion và targetProfile.</text><text x="40" y="1364" class="small" >Provider / model / API ảnh là lựa chọn triển khai cần kiểm chứng, chưa tích hợp hoặc xác nhận quyền sử dụng.</text></svg>