<title id="agent-orchestration-title">Luồng bên trong bộ điều phối agent</title><desc id="agent-orchestration-desc">Router chọn các nhánh nội dung và từ khóa độc lập, bản địa hóa phụ thuộc nội dung, sau đó kiểm tra kết quả; hỏi đáp và xử lý ngoại lệ có nhánh riêng và mọi đề xuất thay đổi đi qua policy gate.</desc><rect width="1280" height="1080" fill="#fafaf7"/><path class="tech-edge" d="M512 220V256Q512 264 504 264H218Q210 264 210 272V320"/><path class="tech-edge" d="M640 220V320"/><path class="tech-edge" d="M752 220V256Q752 264 760 264H1064Q1072 264 1072 272V320"/><rect x="184" y="228" width="300" height="24" fill="#fafaf7"/><text x="334.0" y="245" class="tech-label" text-anchor="middle">chuẩn bị bài đăng: các nhánh độc lập</text><rect x="940" y="228" width="264" height="24" fill="#fafaf7"/><text x="1072.0" y="245" class="tech-label" text-anchor="middle">câu hỏi của người bán</text><path class="tech-edge" d="M812 140H1248Q1256 140 1256 148V736Q1256 744 1248 744H1240"/><rect x="912" y="100" width="268" height="24" fill="#fafaf7"/><text x="1046.0" y="117" class="tech-label" text-anchor="middle">lỗi sàn / lỗi dữ liệu cần phân tích</text><path class="tech-edge" d="M210 520V636"/><rect x="224" y="556" width="176" height="24" fill="#fafaf7"/><text x="312.0" y="573" class="tech-label" text-anchor="middle">bản nội dung đã tạo</text><path class="tech-edge" d="M640 520V636"/><rect x="652" y="556" width="176" height="24" fill="#fafaf7"/><text x="740.0" y="573" class="tech-label" text-anchor="middle">kết quả từ khóa</text><path class="tech-edge" d="M380 736H468"/><path class="tech-edge" d="M640 836V896"/><path class="tech-edge" d="M1072 520V568"/><path class="tech-edge" d="M1072 836V896"/><g><rect class="box" x="468" y="60" width="344" height="160" fill="#f1eaff" stroke="#7c3aed"/><text x="492" y="88" class="tag" >LANGGRAPH · ROUTING</text><text x="492" y="124" class="tech-name" >Chọn nhánh theo sự kiện</text><text x="492" y="164" class="tech-body" >Đọc snapshot đúng doanh nghiệp</text><text x="492" y="192" class="tech-body" >Chỉ chọn workflow đã được bật</text></g><g><rect class="box" x="40" y="320" width="340" height="200" fill="#f1eaff" stroke="#7c3aed"/><text x="64" y="348" class="tag" >AGENT 01 · CONTENT</text><text x="64" y="384" class="tech-name" >Soạn nội dung</text><text x="64" y="424" class="tech-body" >Input: sản phẩm + mẫu được duyệt</text><text x="64" y="452" class="tech-body" >Output: tiêu đề, mô tả, nguồn</text><text x="64" y="480" class="tech-body" >Không tự bịa thông số / chứng nhận</text><text x="64" y="508" class="tech-body" >Độc lập với nhánh từ khóa</text></g><g><rect class="box" x="468" y="320" width="344" height="200" fill="#f1eaff" stroke="#7c3aed"/><text x="492" y="348" class="tag" >AGENT 02 · KEYWORD</text><text x="492" y="384" class="tech-name" >Gợi ý từ khóa</text><text x="492" y="424" class="tech-body" >Input: sản phẩm + ngôn ngữ đích</text><text x="492" y="452" class="tech-body" >Output: từ khóa + giới hạn dữ liệu</text><text x="492" y="480" class="tech-body" >Chạy song song với Content</text><text x="492" y="508" class="tech-body" >Không khẳng định độ phổ biến</text></g><g><rect class="box" x="900" y="320" width="340" height="200" fill="#eaf2ff" stroke="#2563eb"/><text x="924" y="348" class="tag" >AGENT 06 · ASSISTANT</text><text x="924" y="384" class="tech-name" >Trợ lý công việc</text><text x="924" y="424" class="tech-body" >Input: câu hỏi + dữ liệu được phép</text><text x="924" y="452" class="tech-body" >Output: trả lời + link bản ghi</text><text x="924" y="480" class="tech-body" >Công cụ chỉ đọc, lọc theo quyền</text><text x="924" y="508" class="tech-body" >Có hành động → tạo proposal</text></g><text x="1072" y="598" class="tech-body" text-anchor="middle">Trả lời UI / proposal → policy gate</text><g><rect class="box" x="40" y="636" width="340" height="200" fill="#f1eaff" stroke="#7c3aed"/><text x="64" y="664" class="tag" >AGENT 03 · LOCALIZATION</text><text x="64" y="700" class="tech-name" >Bản địa hóa nếu cần</text><text x="64" y="740" class="tech-body" >Nhận bản Content trước khi dịch</text><text x="64" y="768" class="tech-body" >Giữ nguyên sự thật của sản phẩm</text><text x="64" y="796" class="tech-body" >Không cần dịch → giữ bản gốc</text><text x="64" y="824" class="tech-body" >Chuyển bản hoàn chỉnh để kiểm tra</text></g><g><rect class="box" x="468" y="636" width="344" height="200" fill="#fff2d8" stroke="#c45b08"/><text x="492" y="664" class="tag" >AGENT 04 · REVIEW</text><text x="492" y="700" class="tech-name" >Gom kết quả và đối chiếu</text><text x="492" y="740" class="tech-body" >Đợi đủ nhánh được chọn</text><text x="492" y="768" class="tech-body" >So nội dung cuối với dữ liệu gốc</text><text x="492" y="796" class="tech-body" >Output: proposal + cảnh báo</text><text x="492" y="824" class="tech-body" >Không thay bộ kiểm tra bằng code</text></g><g><rect class="box" x="900" y="636" width="340" height="200" fill="#fff2d8" stroke="#c45b08"/><text x="924" y="664" class="tag" >AGENT 05 · EXCEPTION</text><text x="924" y="700" class="tech-name" >Phân tích ngoại lệ</text><text x="924" y="740" class="tech-body" >Input: lỗi + lịch sử đã lọc dữ liệu</text><text x="924" y="768" class="tech-body" >Output: nguyên nhân + bản sửa mới</text><text x="924" y="796" class="tech-body" >Không tự sửa bài đã đăng</text><text x="924" y="824" class="tech-body" >Không tự đăng lại sau lỗi</text></g><text x="640" y="924" class="tech-body" text-anchor="middle">Proposal → validation + policy gate</text><text x="1072" y="924" class="tech-body" text-anchor="middle">Bản sửa mới → validation + policy gate</text><path d="M40 964H1240" stroke="#c7c7c7"/><text x="40" y="1000" class="body" >Dùng chung: AI SDK gọi mô hình · Đầu ra theo schema · Công cụ đọc có giới hạn quyền</text><text x="40" y="1032" class="tech-body" >Cache theo tenant / sản phẩm / phiên bản / ngôn ngữ · Timeout và ngân sách · Giữ phần kết quả hợp lệ khi một nhánh lỗi</text></svg>